[build-system]
requires = ["uv_build ~= 0.13.4"]
build-backend = "uv_build"

[dependency-groups]
ci = [
	"pylint-gitlab",
]
dev = [
	"asgi-types >= 0.2.0",
	"pylint ~= 4.1.3",
	"pyright ~= 1.1.414",
	"pytest ~= 9.2.0",
	"ruff ~= 0.17.3",
]

[project]
name = "webplayercontrol"
version = "1.0.2"
dependencies = [
	"aioscgi >= 2.5.1",
	"dbus-fast >= 5.0.22",
]
requires-python = ">= 3.14"
license = "GPL-3.0-only"
authors = [
	{ name = "Christopher Head" },
]
description = "An ASGI application that exposes Media Player Remote Interfacing Specification (MPRIS)-compliant media players over the web."
readme = "README.md"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Environment :: Web Environment",
	"Intended Audience :: End Users/Desktop",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Topic :: Internet :: WWW/HTTP :: Dynamic Content",
	"Topic :: Multimedia :: Sound/Audio :: Players",
]
urls.Repository = "https://gitlab.com/Hawk777/webplayercontrol"

[tool.pylint.imports]
allow-reexport-from-package = true

[tool.pylint.messages_control]
enable = [
	"deprecated-pragma",
	"useless-suppression",
	"use-symbolic-message-instead",
]
disable = [
	"broad-exception-caught",
	"line-too-long",
	"too-few-public-methods",
	"too-many-instance-attributes",
	"too-many-locals",
]

[tool.pyright]
exclude = [".ruff_cache"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest]
addopts = ["--import-mode=importlib"]
strict = true
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
allowed-confusables = ["’"]
ignore = [
	"COM812", # missing-trailing-comma
	"CPY001", # missing-copyright-notice
	"D203", # one-blank-line-before-class
	"D212", # multi-line-summary-first-line
	"S101", # assert
]
select = ["ALL"]

[tool.uv.build-backend]
source-include = ["tests/**"]
